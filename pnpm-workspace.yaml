# SPDX-License-Identifier: LicenseRef-SUL-1.0
packages:
  - "packages/*"
  - "mechanics/*"
  - "games/*"
  - "samples/*"
  - "apps/*"
# Every dependency is pinned to one exact version (the licence gate checks it).
saveExact: true
# No dependency runs an install script. esbuild works without its postinstall.
allowBuilds:
  esbuild: false
  "@google/genai": false
  protobufjs: false
