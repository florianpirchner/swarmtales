# SPDX-License-Identifier: LicenseRef-SUL-1.0
# The full check on every pull request and on every push to `main`, `develop` and, until the switch (A5),
# `rewrite/develop` (DECISIONS.md, D3, A69). Budget: `pnpm check` itself fails above 10 minutes or 6 GB. Actions are
# pinned by commit; the licence gate checks that (scripts/licences/allowlist.ts). The licence gate also runs on its
# own, fast, in licences.yml.
name: check

on:
  pull_request:
  push:
    branches: [main, develop, rewrite/develop]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out, with the whole history for the sign-off check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm (version from package.json)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
